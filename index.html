    * {

    .card {
      max-width: 420px;
      width: 100%;
      background: var(--card);
      border-radius: 32px;
      padding: 32px 24px 28px;
      text-align: center;

      backdrop-filter: blur(4px);
      position: relative;
      transition: all 0.25s ease;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 33px;
      padding: 1px;
      background: conic-gradient(from 0deg, transparent, rgba(56, 189, 248, 0.2), transparent 70%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      -webkit-mask-composite: xor;
      pointer-events: none;
      animation: rotateGlow 10s linear infinite;
    }

  

    .avatar-wrapper {

    .profile-img {

      object-fit: cover;
      display: block;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      background: #1e293b;
    }

    .profile-img:hover {
      transform: scale(1.04);
      box-shadow: 0 0 45px rgba(56,189,248,0.5), 0 15px 30px rgba(0,0,0,0.6);
    }

    .avatar-wrapper::after {
      content: '';

      inset: -7px;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.2);
      animation: softPulse 2.6s ease-in-out infinite;
